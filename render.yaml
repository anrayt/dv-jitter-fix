services:
  - type: web
    name: dv-jitter-fix
    runtime: static
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: ./
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /lib/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
